aid: ynsect
name: Ynsect
description: >-
  Ÿnsect (Ÿnsect SAS) was a French agri-technology company, founded in Évry, Essonne on
  4 October 2011 by Antoine Hubert, Jean-Gabriel Levon, Fabrice Berro and Alexis Angot,
  that farmed Tenebrio molitor mealworms and Alphitobius diaperinus buffalo larvae in
  automated vertical farms and processed them into high-protein ingredients for
  aquaculture and animal feed, the Spryng pet-food line, food-grade ingredients for human
  nutrition, and the Ynfrass organic fertiliser made from insect frass. It was for a time
  the best-funded insect-protein company in the world, raising roughly €600 million over
  fourteen years, including a €372 million Series C in 2020 and a further €160 million in
  early 2023, and it operated sites at Dole and Damparis in the Jura while building the
  Ynfarm vertical farm at Poulainville near Amiens. The economics never closed: Ÿnsect
  requested safeguard proceedings on 26 September 2024, was placed in judicial
  reorganisation on 3 March 2025, and — unable to fund a continuation plan within the
  observation period — was placed in judicial liquidation on 1 December 2025. The Damparis
  site was taken over in 2025 by Keprea, a separate company founded by Ÿnsect alumni, to
  make fertiliser from insect frass; Keprea is not a successor to Ÿnsect and its surfaces
  are not part of this profile. Ÿnsect was an industrial producer of physical goods and
  never operated a developer program, public API, SDK, webhook surface or machine-readable
  specification of any kind. Its host ynsect.com is still registered to the company but the
  web origin has been switched off — TCP 80 and 443 refuse connections — and ynsect.fr is a
  bare OVH redirect to that dead host, so no pointer to a live company website is wired.
  This profile is retained as a historical record; there is no API surface to enrich.
