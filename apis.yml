x-shutdown-note: >-
  Placed in judicial liquidation (liquidation judiciaire) on 1 December 2025 after
  safeguard proceedings opened 26 September 2024 and judicial reorganisation opened
  3 March 2025. The court found the company could not raise the funds needed to finance
  its continuation plan within the deadlines, despite the strength of its technology
  portfolio and its new operational model.
x-domain-status: dark-origin
x-domain-note: >-
  ynsect.com remains registered to the company at OVH (created 2011-03-05, registry expiry
  2027-03-05, record updated 2026-01-29) and still resolves to 51.75.15.14, but the origin
  is decommissioned: TCP 80 and TCP 443 do not accept connections, so every request to
  ynsect.com and www.ynsect.com fails at connect with no HTTP status. ynsect.fr answers
  HTTP 301 to http://www.ynsect.com/ on every path — a bare OVH domain redirect to the
  dead host. No API, docs, developer, portal, app or console subdomain has ever been
  delegated (all NXDOMAIN), and no GitHub organization exists. See
  well-known/ynsect-well-known.yml for the full 125-probe record. The domain is NOT parked
  or re-registered by a third party, so there is no soft-200 catch-all to guard against —
  unlike all/domio/.
